name = "veki-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Bindings D1/R2/Queues con los nombres reales de producción. database_id (no es secreto) se completa
# con el id que devuelve `wrangler d1 create veki` (ops/DEPLOY.md, paso 2). Vacío hasta ese paso.
[[d1_databases]]
binding = "DB"
database_name = "veki"
database_id = ""
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "veki-media"

[[queues.producers]]
binding = "Q_UPDATES"
queue = "q-updates"

[[queues.producers]]
binding = "Q_JOBS"
queue = "q-jobs"

[[queues.consumers]]
queue = "q-updates"
max_batch_size = 1
max_concurrency = 1

[[queues.consumers]]
queue = "q-jobs"
max_concurrency = 2

[triggers]
crons = ["*/15 * * * *", "0 9 * * *"]

# Secrets (wrangler secret), leídos por el código hoy: TELEGRAM_BOT_TOKEN, TG_WEBHOOK_SECRET, DEPLOY_HOOK_URL,
# GROQ_API_KEY (y GEMINI_API_KEY, declarada en env.ts). Locales en .dev.vars. Ver ops/DEPLOY.md, paso 6.
[vars]
# Allowlist de chats: "id:owner,id:admin". Vacía en el repo (los ids son datos personales de un repo público);
# se completa solo en el despliegue, según ops/DEPLOY.md, paso 7.
ALLOWED_CHAT_IDS = ""
